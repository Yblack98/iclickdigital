<!DOCTYPE html>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f9f8f6',
              100: '#f0ece4',
              200: '#e2d7c8',

        }

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: #2d1810; border: 1px solid rgba(212, 163, 115, 0.2); }

<body class="bg-brand-50 text-brand-900 min-h-screen flex flex-col antialiased">

  <!-- Nav -->

    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-8">
    <div class="glass-card text-brand-50 p-6 rounded-3xl">
      <h2 class="text-lg font-bold mb-2">Admin Dashboard Controls</h2>
      <p class="text-xs text-brand-200">Manage student grades, LMS Zoom links, and incoming service engagement inquiries.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-brand-900 border-t border-brand-800 text-xs text-brand-300 py-10 mt-auto">
